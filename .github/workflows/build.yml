name: Build

on:
  push:
    branches:
      - main
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - 'versions.env'
      - 'scripts/**'
      - 'test/**'
      - 'AGENTS.md'
      - 'compliance/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'versions.env'
      - 'scripts/**'
      - 'test/**'
      - 'AGENTS.md'
      - 'compliance/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: scad-toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@v4

      - name: Load versions
        timeout-minutes: 2
        id: versions
        shell: bash
        run: |
          set -a
          source versions.env
          set +a

          echo "toolchain=${TOOLCHAIN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "pythonscad=${PYTHONSCAD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "bosl2=${BOSL2_VERSION}" >> "$GITHUB_OUTPUT"
          echo "pybosl2=${PYBOSL2_VERSION}" >> "$GITHUB_OUTPUT"
          echo "shapely=${SHAPELY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "docsgen=${OPENSCAD_DOCSGEN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "pillow=${PILLOW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "scons=${SCONS_VERSION}" >> "$GITHUB_OUTPUT"
          echo "drawsvg=${DRAWSVG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        timeout-minutes: 2
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        timeout-minutes: 2
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata — OpenSCAD runtime
        timeout-minutes: 2
        id: meta_openscad
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/scad-toolchain-openscad
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Docker metadata — drawing runtime
        timeout-minutes: 2
        id: meta_drawing
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/scad-toolchain-drawing
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Docker metadata — full runtime
        timeout-minutes: 2
        id: meta_full
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/scad-toolchain
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build OpenSCAD runtime
        timeout-minutes: 10
        uses: docker/build-push-action@v6
        with:
          context: .
          target: openscad
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          build-args: |
            TOOLCHAIN_VERSION=${{ steps.versions.outputs.toolchain }}
            BOSL2_VERSION=${{ steps.versions.outputs.bosl2 }}
            OPENSCAD_DOCSGEN_VERSION=${{ steps.versions.outputs.docsgen }}
            PILLOW_VERSION=${{ steps.versions.outputs.pillow }}
            SCONS_VERSION=${{ steps.versions.outputs.scons }}
          tags: ${{ steps.meta_openscad.outputs.tags }}
          labels: ${{ steps.meta_openscad.outputs.labels }}
          cache-from: type=gha

      - name: Build drawing runtime
        timeout-minutes: 10
        uses: docker/build-push-action@v6
        with:
          context: .
          target: drawing
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          build-args: |
            TOOLCHAIN_VERSION=${{ steps.versions.outputs.toolchain }}
            BOSL2_VERSION=${{ steps.versions.outputs.bosl2 }}
            OPENSCAD_DOCSGEN_VERSION=${{ steps.versions.outputs.docsgen }}
            PILLOW_VERSION=${{ steps.versions.outputs.pillow }}
            SCONS_VERSION=${{ steps.versions.outputs.scons }}
            DRAWSVG_VERSION=${{ steps.versions.outputs.drawsvg }}
          tags: ${{ steps.meta_drawing.outputs.tags }}
          labels: ${{ steps.meta_drawing.outputs.labels }}
          cache-from: type=gha

      - name: Build full runtime
        timeout-minutes: 10
        uses: docker/build-push-action@v6
        with:
          context: .
          target: full
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          build-args: |
            TOOLCHAIN_VERSION=${{ steps.versions.outputs.toolchain }}
            PYTHONSCAD_VERSION=${{ steps.versions.outputs.pythonscad }}
            BOSL2_VERSION=${{ steps.versions.outputs.bosl2 }}
            PYBOSL2_VERSION=${{ steps.versions.outputs.pybosl2 }}
            SHAPELY_VERSION=${{ steps.versions.outputs.shapely }}
            OPENSCAD_DOCSGEN_VERSION=${{ steps.versions.outputs.docsgen }}
            PILLOW_VERSION=${{ steps.versions.outputs.pillow }}
            SCONS_VERSION=${{ steps.versions.outputs.scons }}
          tags: ${{ steps.meta_full.outputs.tags }}
          labels: ${{ steps.meta_full.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test published runtime contracts
        timeout-minutes: 7
        shell: bash
        env:
          OPENSCAD_TAGS: ${{ steps.meta_openscad.outputs.tags }}
          DRAWING_TAGS: ${{ steps.meta_drawing.outputs.tags }}
          FULL_TAGS: ${{ steps.meta_full.outputs.tags }}
        run: |
          set -euo pipefail

          OPENSCAD_IMAGE="$(printf '%s\n' "$OPENSCAD_TAGS" | head -n1)"
          DRAWING_IMAGE="$(printf '%s\n' "$DRAWING_TAGS" | head -n1)"
          FULL_IMAGE="$(printf '%s\n' "$FULL_TAGS" | head -n1)"

          echo "OpenSCAD runtime: ${OPENSCAD_IMAGE}"
          docker run --rm \
            -v "$PWD:/work" \
            "$OPENSCAD_IMAGE" \
            bash /work/scripts/test-toolchain.sh

          echo "Drawing runtime: ${DRAWING_IMAGE}"
          docker run --rm \
            -v "$PWD:/work" \
            "$DRAWING_IMAGE" \
            bash /work/scripts/test-toolchain.sh

          echo "Full runtime: ${FULL_IMAGE}"
          docker run --rm \
            -v "$PWD:/work" \
            "$FULL_IMAGE" \
            bash /work/scripts/test-toolchain.sh

          echo "Local unpacked image sizes after smoke test:"
          docker image inspect \
            --format='{{.RepoTags}} {{.Size}} bytes' \
            "$OPENSCAD_IMAGE" \
            "$DRAWING_IMAGE" \
            "$FULL_IMAGE"

      - name: Prepare open-source release documents
        timeout-minutes: 2
        shell: bash
        env:
          OPENSCAD_TAGS: ${{ steps.meta_openscad.outputs.tags }}
          DRAWING_TAGS: ${{ steps.meta_drawing.outputs.tags }}
          FULL_TAGS: ${{ steps.meta_full.outputs.tags }}
          TOOLCHAIN_VERSION: ${{ steps.versions.outputs.toolchain }}
        run: |
          set -euo pipefail

          RELEASE_VERSION="v${TOOLCHAIN_VERSION}"
          OPENSCAD_IMAGE="$(printf '%s\n' "$OPENSCAD_TAGS" | head -n1)"
          DRAWING_IMAGE="$(printf '%s\n' "$DRAWING_TAGS" | head -n1)"
          FULL_IMAGE="$(printf '%s\n' "$FULL_TAGS" | head -n1)"

          rm -rf release-compliance release-assets
          mkdir -p \
            release-compliance/openscad \
            release-compliance/drawing \
            release-compliance/full \
            release-assets

          for entry in \
            "openscad:$OPENSCAD_IMAGE" \
            "drawing:$DRAWING_IMAGE" \
            "full:$FULL_IMAGE"
          do
            profile="${entry%%:*}"
            image="${entry#*:}"

            docker run --rm "$image" \
              cat /usr/share/doc/scad-toolchain/OPEN_SOURCE_ACKNOWLEDGMENTS.txt \
              > "release-assets/scad-toolchain-${RELEASE_VERSION}-${profile}-open-source-acknowledgments.txt"

            docker run --rm "$image" \
              cat /usr/share/doc/scad-toolchain/OPEN_SOURCE_ACKNOWLEDGMENTS.pdf \
              > "release-assets/scad-toolchain-${RELEASE_VERSION}-${profile}-open-source-acknowledgments.pdf"

            for file in \
              DIRECT_LICENSE_FILES.txt \
              DEBIAN_PACKAGES.txt \
              PYTHON_DISTRIBUTIONS.txt
            do
              docker run --rm "$image" \
                cat "/usr/share/doc/scad-toolchain/$file" \
                > "release-compliance/${profile}/$file"
            done
          done

          python3 - "${RELEASE_VERSION}" <<'PY'
          from pathlib import Path
          import sys
          import zipfile

          version = sys.argv[1]
          source = Path("release-compliance")
          output = Path("release-assets") / (
              f"scad-toolchain-{version}-open-source-compliance-support.zip"
          )

          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(source.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(source))
          PY

          test -s "release-assets/scad-toolchain-${RELEASE_VERSION}-openscad-open-source-acknowledgments.pdf"
          test -s "release-assets/scad-toolchain-${RELEASE_VERSION}-drawing-open-source-acknowledgments.pdf"
          test -s "release-assets/scad-toolchain-${RELEASE_VERSION}-full-open-source-acknowledgments.pdf"
          test -s "release-assets/scad-toolchain-${RELEASE_VERSION}-openscad-open-source-acknowledgments.txt"
          test -s "release-assets/scad-toolchain-${RELEASE_VERSION}-drawing-open-source-acknowledgments.txt"
          test -s "release-assets/scad-toolchain-${RELEASE_VERSION}-full-open-source-acknowledgments.txt"
          test -s "release-assets/scad-toolchain-${RELEASE_VERSION}-open-source-compliance-support.zip"

          head -c 8 \
            "release-assets/scad-toolchain-${RELEASE_VERSION}-openscad-open-source-acknowledgments.pdf" \
            | grep -q '%PDF-1.4'
          head -c 8 \
            "release-assets/scad-toolchain-${RELEASE_VERSION}-drawing-open-source-acknowledgments.pdf" \
            | grep -q '%PDF-1.4'
          head -c 8 \
            "release-assets/scad-toolchain-${RELEASE_VERSION}-full-open-source-acknowledgments.pdf" \
            | grep -q '%PDF-1.4'

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${RELEASE_VERSION}" ]]; then
            echo "ERROR: tag ${GITHUB_REF_NAME} does not match versions.env ${RELEASE_VERSION}" >&2
            exit 1
          fi

      - name: Upload release acknowledgment documents
        timeout-minutes: 2
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: open-source-acknowledgments-${{ github.ref_name }}
          path: |
            release-assets/
            release-compliance/
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release acknowledgment assets
        timeout-minutes: 2
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          SCAD toolchain ${VERSION}

          The OpenSCAD-focused, drawing and full runtime images are published
          under the matching immutable GHCR tag.

          Open-source acknowledgment PDFs and their matching TXT documents are
          attached directly to this release. Supporting license/package
          inventories are bundled in the compliance ZIP.
          EOF

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" release-assets/* --clobber
          else
            gh release create "${VERSION}" \
              --verify-tag \
              --title "SCAD toolchain ${VERSION}" \
              --notes-file release-notes.md \
              release-assets/*
          fi

          EXPECTED_ASSETS=(
            "scad-toolchain-${VERSION}-openscad-open-source-acknowledgments.pdf"
            "scad-toolchain-${VERSION}-drawing-open-source-acknowledgments.pdf"
            "scad-toolchain-${VERSION}-full-open-source-acknowledgments.pdf"
            "scad-toolchain-${VERSION}-openscad-open-source-acknowledgments.txt"
            "scad-toolchain-${VERSION}-drawing-open-source-acknowledgments.txt"
            "scad-toolchain-${VERSION}-full-open-source-acknowledgments.txt"
            "scad-toolchain-${VERSION}-open-source-compliance-support.zip"
          )

          ACTUAL_ASSETS="$(gh release view "${VERSION}" --json assets --jq '.assets[].name')"
          for asset in "${EXPECTED_ASSETS[@]}"; do
            if ! grep -Fxq "${asset}" <<< "${ACTUAL_ASSETS}"; then
              echo "ERROR: GitHub Release is missing expected asset: ${asset}" >&2
              exit 1
            fi
          done

          echo "Published GitHub Release assets for ${VERSION}."

      - name: Trigger external consumer tests
        timeout-minutes: 2
        if: >-
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        shell: bash
        env:
          SCAD_TOOLCHAIN_TEST_TOKEN: ${{ secrets.SCAD_TOOLCHAIN_TEST_TOKEN }}
          TARGET_REPOSITORY: brainboxemb/docker.scad-toolchain.test
          TARGET_WORKFLOW: test.yml
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TOOLCHAIN_VERSION="${GITHUB_REF_NAME}"
          else
            TOOLCHAIN_VERSION="edge"
          fi

          PAYLOAD="$(jq -nc \
            --arg ref "main" \
            --arg version "$TOOLCHAIN_VERSION" \
            '{ref: $ref, inputs: {toolchain_version: $version}}')"

          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${SCAD_TOOLCHAIN_TEST_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TARGET_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/dispatches" \
            --data "$PAYLOAD"

          echo "Triggered ${TARGET_REPOSITORY}/${TARGET_WORKFLOW} for toolchain ${TOOLCHAIN_VERSION}."
